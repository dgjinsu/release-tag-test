name: rc-release
# 트리거 ①: release/ 로 시작하는 브랜치에 push 되면 후보(rc) Release 를 자동 발행한다.
on:
  push:
    branches: ['release/**']

permissions:
  contents: write            # 태그 생성 + Release 생성에 필요

jobs:
  rc:
    runs-on: ubuntu-latest   # 테스트라 GitHub 호스팅 러너. 실제는 [self-hosted, nexus]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: rc 태그 이름 계산 (VERSION + 기존 rc 최대 번호 + 1)
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          PREV=$(git tag -l "v${V}-rc.*" --sort=-v:refname | head -1)
          if [ -n "$PREV" ]; then N=$(( ${PREV##*-rc.} + 1 )); else N=1; fi
          TAG="v${V}-rc.${N}"
          echo "TAG=$TAG"   >> "$GITHUB_ENV"
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          echo "이번 태그: $TAG (직전 rc: ${PREV:-없음})"

      - name: 바뀐 서비스 판별 (직전 rc 대비 services/ 아래 diff)
        run: |
          if [ -z "$PREV" ]; then
            CHANGED=$(ls services)
            echo "직전 rc 없음 → 전체 빌드"
          else
            CHANGED=$(git diff --name-only "$PREV" HEAD -- services/ | cut -d/ -f2 | sort -u)
            gh release download "$PREV" -p images.json -O prev-images.json
          fi
          { echo "CHANGED<<LIST"; echo "$CHANGED"; echo "LIST"; } >> "$GITHUB_ENV"
          echo "빌드 대상: ${CHANGED:-없음}"

      - name: 빌드 (실제 환경에서는 docker build → Nexus push → docker save 자리)
        run: |
          PREVJSON=prev-images.json; [ -f "$PREVJSON" ] || PREVJSON=-
          # shellcheck disable=SC2086
          bash ci/build.sh "$TAG" "$PREVJSON" $CHANGED

      - name: Release 생성 (Pre-release)
        run: |
          gh release create "$TAG" out/* \
            --prerelease --generate-notes \
            --title "$TAG" --target "$GITHUB_SHA"
          {
            echo "### Release $TAG 발행 (Pre-release)"
            echo "- 직전 rc: ${PREV:-없음}"
            echo "- 빌드한 서비스: ${CHANGED:-없음}"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
