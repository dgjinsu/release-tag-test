name: rc-release
# 트리거 ①: release/<버전> 브랜치에 push 되면 후보(rc) Release 를 자동 발행한다.
#           버전은 브랜치 이름에서 읽는다.  release/1.1.0 → v1.1.0-rc.1, rc.2, ...
on:
  push:
    branches: ['release/**']

permissions:
  contents: write            # 태그 생성 + Release 생성에 필요

jobs:
  rc:
    runs-on: ubuntu-latest   # 테스트라 GitHub 호스팅 러너. 실제는 [self-hosted, nexus]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 버전 = 브랜치 이름 (release/1.1.0 → 1.1.0)
        run: |
          V="${GITHUB_REF_NAME#release/}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::브랜치 이름이 release/<MAJOR.MINOR.PATCH> 형식이 아닙니다: $GITHUB_REF_NAME"; exit 1
          fi
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "::error::v${V} 는 이미 정식 릴리즈된 버전입니다. 새 버전 브랜치(예: release/$(echo "$V" | awk -F. '{print $1"."$2"."$3+1}'))를 만드세요"; exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"
          echo "버전: $V (브랜치 $GITHUB_REF_NAME)"

      - name: rc 번호 계산 (이 버전의 기존 rc 최대 번호 + 1)
        run: |
          LAST_RC=$(git tag -l "v${V}-rc.*" --sort=-v:refname | head -1)
          if [ -n "$LAST_RC" ]; then N=$(( ${LAST_RC##*-rc.} + 1 )); else N=1; fi
          TAG="v${V}-rc.${N}"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "LAST_RC=$LAST_RC" >> "$GITHUB_ENV"
          echo "이번 태그: $TAG (직전 rc: ${LAST_RC:-없음})"

      - name: 비교 기준 결정 (직전 rc → 없으면 최신 정식 릴리즈 → 없으면 전체 빌드)
        run: |
          BASE="$LAST_RC"
          if [ -z "$BASE" ]; then
            BASE=$(git tag -l 'v[0-9]*' | grep -v -- '-rc\.' | sort -V | tail -1 || true)
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "비교 기준: ${BASE:-없음 → 전체 빌드}"

      - name: 바뀐 서비스 판별 (비교 기준 대비 services/ 아래 diff)
        run: |
          if [ -z "$BASE" ]; then
            CHANGED=$(ls services)
          else
            CHANGED=$(git diff --name-only "$BASE" HEAD -- services/ | cut -d/ -f2 | sort -u)
            gh release download "$BASE" -p images.json -O prev-images.json
          fi
          { echo "CHANGED<<LIST"; echo "$CHANGED"; echo "LIST"; } >> "$GITHUB_ENV"
          echo "빌드 대상: ${CHANGED:-없음}"

      - name: 빌드 (실제 환경에서는 docker build → Nexus push → docker save 자리)
        run: |
          PREVJSON=prev-images.json; [ -f "$PREVJSON" ] || PREVJSON=-
          # shellcheck disable=SC2086
          bash ci/build.sh "$TAG" "$PREVJSON" $CHANGED

      - name: Release 생성 (Pre-release)
        run: |
          gh release create "$TAG" out/* \
            --prerelease --generate-notes \
            --title "$TAG" --target "$GITHUB_SHA"
          {
            echo "### Release $TAG 발행 (Pre-release)"
            echo "- 브랜치: $GITHUB_REF_NAME"
            echo "- 비교 기준: ${BASE:-없음(전체 빌드)}"
            echo "- 빌드한 서비스: ${CHANGED:-없음}"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
